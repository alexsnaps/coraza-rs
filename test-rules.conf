# Test rules for FTW integration validation

SecRuleEngine On
SecRequestBodyAccess On

# Block requests with "malicious" in query parameters
SecRule ARGS "@contains malicious" \
    "id:100001,\
    phase:1,\
    deny,\
    status:403,\
    msg:'Malicious pattern detected in arguments'"

# Block requests with "attack" in request body
SecRule REQUEST_BODY "@contains attack" \
    "id:100002,\
    phase:2,\
    deny,\
    status:403,\
    msg:'Attack pattern detected in body'"
