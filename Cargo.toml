[package]
name = "coraza"
version = "0.1.0"
edition = "2024"

[dependencies]
# Lightweight, fast random number generator (no dependencies)
fastrand = "2.0"

# Cryptographic hash functions (RustCrypto)
md-5 = "0.10"
sha1 = "0.10"

# Pattern matching
regex = "1.10"
aho-corasick = "1.1"

# IP address and network utilities
ipnet = "2.9"

# HTML entity decoding
htmlescape = "0.3"

# Path normalization
path-clean = "1.0"

# Glob pattern matching for file includes
glob = "0.3"

# MIME type parsing (for Content-Type)
mime = "0.3"

# JSON parsing
serde_json = "1.0"

# XML parsing
quick-xml = "0.36"

# Async runtime and HTTP server (for ftw_server example)
tokio = { version = "1.0", features = ["full"], optional = true }
hyper = { version = "1.0", features = ["full"], optional = true }
http-body-util = { version = "0.1", optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }

[dev-dependencies]
tempfile = "3.27.0"

[features]
default = []
async-server = ["tokio", "hyper", "http-body-util", "hyper-util"]
