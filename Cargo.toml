[package]
name = "coraza"
version = "0.1.0"
edition = "2024"

[dependencies]
# Lightweight, fast random number generator (no dependencies)
fastrand = "2.0"

# Cryptographic hash functions (RustCrypto)
md-5 = "0.10"
sha1 = "0.10"

# SecLang parsing
winnow = { version = "1.0", default-features = false, features = ["std", "parser"] }

# Pattern matching
regex = "1.10"
aho-corasick = "1.1"

# IP address and network utilities
ipnet = "2.9"

# Glob pattern matching for file includes
glob = "0.3"

# MIME type parsing (for Content-Type)
mime = "0.3"

# JSON parsing
serde_json = "1.0"

# XML parsing
quick-xml = "0.36"

# SQL/XSS injection detection (a port of libinjection). Its `std` feature has
# the byte searches use AVX2 where the CPU has it, which speeds up long inputs.
libperfusion = { git = "https://github.com/alexsnaps/libperfusion", branch = "main", features = ["std"] }

# Async runtime and HTTP server (for ftw_server example)
tokio = { version = "1.0", features = ["full"], optional = true }
hyper = { version = "1.0", features = ["full"], optional = true }
http-body-util = { version = "0.1", optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }

[dev-dependencies]
tempfile = "3.27.0"
divan = { version = "0.1.21", default-features = false }

[features]
default = []
async-server = ["tokio", "hyper", "http-body-util", "hyper-util"]

[[example]]
name = "ftw_server_async"
required-features = ["async-server"]

[[bench]]
name = "crs"
harness = false
